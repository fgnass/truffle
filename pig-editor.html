<title>Piggy frame editor</title>
<style>
  :root{color-scheme:light dark}
  *{box-sizing:border-box}
  body{margin:0;font:14px/1.45 ui-sans-serif,system-ui,sans-serif;background:#f4f1ea;color:#2a2722}
  .app{display:flex;gap:16px;max-width:1180px;margin:0 auto;padding:18px 16px 60px}
  .canvas-wrap{flex:1;min-width:0}
  .stage{background:#fffdf8;border:1px solid #e6e0d4;border-radius:16px;box-shadow:0 8px 24px -16px #000;overflow:hidden}
  svg#c{display:block;width:100%;height:auto;touch-action:none;background:
     repeating-linear-gradient(0deg,#fdfbf5,#fdfbf5 27px,#f6f2e9 27px,#f6f2e9 28px)}
  .side{width:268px;flex-shrink:0;display:flex;flex-direction:column;gap:14px}
  .card{background:#fffdf8;border:1px solid #e6e0d4;border-radius:12px;padding:12px}
  h2{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:#9a9284;margin:0 0 9px}
  .seg{display:flex;gap:6px}
  button{font:inherit;border:1px solid #d9d2c4;background:#fff;color:#2a2722;border-radius:9px;padding:7px 10px;cursor:pointer}
  button:hover{background:#f6f2e9}
  button.on{background:#1a1714;color:#fff;border-color:#1a1714}
  button.wide{width:100%;margin-top:6px}
  .seg button{flex:1}
  label{font-size:12px;color:#7a7468;display:flex;align-items:center;gap:8px;margin:7px 0}
  label input[type=range]{flex:1;accent-color:#d6336c}
  .nav{display:flex;align-items:center;gap:8px;margin-bottom:8px}
  .nav .fnum{font-variant-numeric:tabular-nums;font-weight:600;min-width:46px;text-align:center}
  .pips{display:flex;gap:4px}.pips button{padding:6px 0;flex:1}
  .hint{font-size:11.5px;color:#9a9284;line-height:1.5}
  .row2{display:flex;gap:6px}.row2 button{flex:1}
  kbd{background:#ece6d8;border-radius:4px;padding:0 4px;font:11px ui-monospace,monospace}
  .save-state{font-size:11px;color:#9a9284;margin-top:6px;min-height:14px}
</style>
<div class="app">
  <div class="canvas-wrap">
    <div class="stage">
      <svg id="c" viewBox="0 0 550 443" preserveAspectRatio="xMidYMid meet">
        <g id="ghost"></g>
        <g id="shape" color="#1a1714"></g>
        <g id="handles"></g>
      </svg>
    </div>
    <p class="hint" style="margin:10px 2px">
      Drag <b>anchors</b> to reshape, the small dots are bezier <b>handles</b>.
      Switch parts above. <kbd>←</kbd>/<kbd>→</kbd> change frame · <kbd>p</kbd>/<kbd>n</kbd> copy node from prev/next · <kbd>P</kbd>/<kbd>N</kbd> copy whole shape · <kbd>a</kbd> re-anchor selected · <kbd>R</kbd> reset.
    </p>
  </div>

  <div class="side">
    <div class="card">
      <h2>Frame</h2>
      <div class="nav">
        <button id="prev">◀</button>
        <span class="fnum"><span id="fn">0</span>/51</span>
        <button id="next">▶</button>
      </div>
      <input id="scrub" type="range" min="0" max="51" value="0" style="width:100%">
      <div class="row2" style="margin-top:8px">
        <button id="shapeprev">⧉ Shape ◀ prev (P)</button>
        <button id="shapenext">Shape next ▶ (N)</button>
      </div>
      <div class="row2" style="margin-top:6px">
        <button id="nodeprev">⧉ Node ◀ prev (p)</button>
        <button id="nodenext">Node next ▶ (n)</button>
      </div>
      <button class="wide" id="reset" style="margin-top:6px">↺ Reset to pose 1</button>
      <div class="save-state" id="savestate"></div>
    </div>

    <div class="card">
      <h2>Edit part</h2>
      <div class="seg">
        <button data-part="body" class="on">Body</button>
        <button data-part="ear">Ear</button>
        <button data-part="tail">Tail</button>
        <button data-part="eye">Eye</button>
      </div>
      <div id="part-ctl"></div>
    </div>

    <div class="card">
      <h2>Onion &amp; preview</h2>
      <label><input id="xray" type="checkbox"> x-ray new pig (no fill)</label>
      <label><input id="ghostprev" type="checkbox"> <span style="color:#2563eb">show previous frame</span></label>
      <label><input id="ghostnext" type="checkbox"> <span style="color:#16a34a">show next frame</span></label>
      <label><input id="ghostfirst" type="checkbox"> <span style="color:#7c3aed">show 1st frame</span></label>
      <label><input id="showdie" type="checkbox" checked> show die</label>
      <label><input id="showh" type="checkbox" checked> show handles</label>
      <h2 style="margin-top:12px">Die value</h2>
      <div class="pips" id="vals"></div>
    </div>

    <div class="card">
      <h2>Export</h2>
      <button class="wide" id="gen">⬇ Generate Pig.tsx</button>
      <button class="wide" id="copysvg">⧉ Copy frame as SVG</button>
      <button class="wide" id="savej">⬇ Save frames JSON</button>
      <button class="wide" id="loadj">⬆ Load frames JSON</button>
      <button class="wide" id="clear">🗑 Clear saved edits</button>
      <input id="file" type="file" accept="application/json" hidden>
    </div>
  </div>
</div>

// tail/ear are attached to a body anchor: how far that anchor moved from the rest pose
function bindDelta(fr,b){ const r=init.body[b.i], c=fr.body[b.i]; return [c.x-r.x, c.y-r.y]; }
// the rump node (where the tail attaches): its handles keep a fixed tangent angle, length only
const BUTT_NODE=TAIL_BIND.i;
let selNode=null;  // currently-selected body node index (for copy-from-prev)
// the tail's start is glued to a point ON the body outline, so it tracks the deforming surface
const TAIL_ATTACH=init.tail.attach;
function evalCubic(a,b,t){const mt=1-t,P0=[a.x,a.y],P1=a.ho,P2=b.hi,P3=[b.x,b.y];
  return [mt*mt*mt*P0[0]+3*mt*mt*t*P1[0]+3*mt*t*t*P2[0]+t*t*t*P3[0],
          mt*mt*mt*P0[1]+3*mt*mt*t*P1[1]+3*mt*t*t*P2[1]+t*t*t*P3[1]];}
function tailAttach(nodes){const a=nodes[TAIL_ATTACH.seg],b=nodes[(TAIL_ATTACH.seg+1)%nodes.length];return evalCubic(a,b,TAIL_ATTACH.t);}
const TAIL_REST=tailAttach(init.body);
function tailDelta(fr){const p=tailAttach(fr.body);return [p[0]-TAIL_REST[0],p[1]-TAIL_REST[1]];}
function defaultFrames(){ return (Array.isArray(SEED)&&SEED.length===NFR) ? clone(SEED) : Array.from({length:NFR},(_,k)=>initPose(k)); }
let frames=defaultFrames();
let cur=0, part='body', value=5, drag=null;

// ---------- persistence ----------
function save(){ localStorage.setItem(LS,JSON.stringify(frames)); flag('saved ✓'); }
let flagT; function flag(t){ const e=document.getElementById('savestate'); e.textContent=t; clearTimeout(flagT); flagT=setTimeout(()=>e.textContent='',1200); }
(function load(){ try{const s=JSON.parse(localStorage.getItem(LS)); if(Array.isArray(s)&&s.length===NFR) frames=s;}catch(e){} })();

// ---------- path emit ----------
function emitBody(n){
  let d=`M${n[0].x} ${n[0].y}`;
  for(let i=0;i<n.length;i++){const a=n[i],b=n[(i+1)%n.length];
    d+=`C${a.ho[0]} ${a.ho[1]} ${b.hi[0]} ${b.hi[1]} ${b.x} ${b.y}`;}
  return d+'Z';
}
function pips(v){const P=[],TL=[20.58,20.58],TR=[44.58,20.58],BR=[44.58,44.58],BL=[20.58,44.58],ML=[20.58,32.58],MR=[44.58,32.58],C=[32.58,32.58];
  if(v>3)P.push(TL,BR); if(v>1)P.push(TR,BL); if(v===6)P.push(ML,MR); if(v%2)P.push(C); return P;}
function dieMarkup(tx,ty,rot,col){
  const c=pips(value).map(([x,y])=>`<circle cx="${x}" cy="${y}" r="5" fill="${col}"/>`).join('');
  return `<g transform="translate(${tx} ${ty}) rotate(${rot})"><rect width="54" height="54" x="5.58" y="5.58" fill="${col==='currentColor'?'#fff':'none'}" stroke="${col}" stroke-width="10" rx="9"/>${c}</g>`;
}
function shapeMarkup(fr,fx,{die=true,fill='#fff',col='currentColor'}={}){
  const e=fr.ear,t=fr.tail,ey=fr.eye, ed=bindDelta(fr,EAR_BIND), td=tailDelta(fr), ep=eyePos(fr);
  let s=`<path d="${emitBody(fr.body)}" fill="${fill}" ${STROKE.replace('currentColor',col)}/>`;
  s+=`<g transform="translate(${(e.dx+ed[0]).toFixed(1)} ${(e.dy+ed[1]).toFixed(1)}) rotate(${e.rot} ${EAR_PV[0]} ${EAR_PV[1]})"><path d="${EAR_FILL}" fill="${fill}"/><path d="${EAR_STROKE}" fill="none" ${STROKE.replace('currentColor',col)}/></g>`;
  s+=`<g transform="translate(${(t.dx+td[0]).toFixed(1)} ${(t.dy+td[1]).toFixed(1)}) rotate(${t.rot} ${TAIL_PV[0]} ${TAIL_PV[1]})"><path d="${TAIL_D}" fill="none" ${STROKE.replace('currentColor',col)}/></g>`;
  s+=`<g transform="translate(${ep[0].toFixed(1)} ${ep[1].toFixed(1)})"><path d="${ey.state==='open'?EYE_OPEN:EYE_CLOSED}" fill="${col}"/></g>`;
  if(die && dice[cur]){const[dx,dy,rot]=dice[cur]; s+=dieMarkup(dx-fx,dy,rot,col);}
  return s;
}

// ---------- render ----------
const svg=document.getElementById('c');
const $gh=document.getElementById('ghost'),$sh=document.getElementById('shape'),$hd=document.getElementById('handles');
function renderGhost(){
  let s='';
  const ghost=(k,col)=>{ if(k<0||k>=NFR||k===cur)return; s+=`<g opacity="0.32">${shapeMarkup(frames[k],550*cur,{die:false,fill:'none',col})}</g>`; };
  if(document.getElementById('ghostfirst').checked) ghost(0,'#7c3aed');   // violet
  if(document.getElementById('ghostprev').checked) ghost(cur-1,'#2563eb'); // blue
  if(document.getElementById('ghostnext').checked) ghost(cur+1,'#16a34a'); // green
  $gh.innerHTML=s;
}
function renderShape(){ const xray=document.getElementById('xray').checked;
  $sh.innerHTML=shapeMarkup(frames[cur],550*cur,{die:document.getElementById('showdie').checked, fill:xray?'none':'#fff'}); }

function H(x,y,cls){return {x,y,cls};}
function renderHandles(){
  if(!document.getElementById('showh').checked){$hd.innerHTML='';return;}
  const fr=frames[cur]; let s='';
  if(part==='body'){
    fr.body.forEach((n,i)=>{
      s+=`<line x1="${n.x}" y1="${n.y}" x2="${n.hi[0]}" y2="${n.hi[1]}" stroke="#888" stroke-width="1"/>`;
      s+=`<line x1="${n.x}" y1="${n.y}" x2="${n.ho[0]}" y2="${n.ho[1]}" stroke="#888" stroke-width="1"/>`;
      s+=`<circle cx="${n.hi[0]}" cy="${n.hi[1]}" r="4.5" fill="#fff" stroke="#888" stroke-width="1.5" data-h="hi" data-i="${i}"/>`;
      s+=`<circle cx="${n.ho[0]}" cy="${n.ho[1]}" r="4.5" fill="#fff" stroke="#888" stroke-width="1.5" data-h="ho" data-i="${i}"/>`;
      const sel=i===selNode, hw=sel?7:5;
      s+=`<rect x="${n.x-hw}" y="${n.y-hw}" width="${hw*2}" height="${hw*2}" rx="2" fill="#d6336c" stroke="${sel?'#1a1714':'#fff'}" stroke-width="${sel?2.5:1.5}" data-h="anchor" data-i="${i}"/>`;
    });
  } else if(part==='ear'||part==='tail'){
    const pv=part==='ear'?EAR_PV:TAIL_PV, o=fr[part], bd=part==='ear'?bindDelta(fr,EAR_BIND):tailDelta(fr);
    const cx=pv[0]+o.dx+bd[0], cy=pv[1]+o.dy+bd[1], rad=Math.PI/180*o.rot;
    const hx=cx+Math.sin(rad)*52, hy=cy-Math.cos(rad)*52;
    s+=`<line x1="${cx}" y1="${cy}" x2="${hx.toFixed(1)}" y2="${hy.toFixed(1)}" stroke="#d6336c" stroke-width="1.5"/>`;
    s+=`<circle cx="${hx.toFixed(1)}" cy="${hy.toFixed(1)}" r="7" fill="#d6336c" stroke="#fff" stroke-width="2" data-h="rot"/>`;
    s+=`<circle cx="${cx}" cy="${cy}" r="7" fill="#fff" stroke="#d6336c" stroke-width="2.5" data-h="move"/>`;
  } else if(part==='eye'){
    const ep=eyePos(fr);   // computed from the head — not draggable
    s+=`<circle cx="${ep[0].toFixed(1)}" cy="${ep[1].toFixed(1)}" r="13" fill="none" stroke="#d6336c" stroke-width="2" stroke-dasharray="3 3"/>`;
    s+=`<circle cx="${ep[0].toFixed(1)}" cy="${ep[1].toFixed(1)}" r="2.5" fill="#d6336c"/>`;
  }
  $hd.innerHTML=s;
}
function renderAll(){ renderGhost();renderShape();renderHandles();
  document.getElementById('fn').textContent=cur; document.getElementById('scrub').value=cur; }

// ---------- pointer ----------
function toSVG(e){const p=svg.createSVGPoint();p.x=e.clientX;p.y=e.clientY;const m=svg.getScreenCTM().inverse();const q=p.matrixTransform(m);return{x:q.x,y:q.y};}
svg.addEventListener('pointerdown',e=>{
  const t=e.target, h=t.getAttribute&&t.getAttribute('data-h'); if(!h)return;
  const p=toSVG(e); const fr=frames[cur];
  try{ svg.setPointerCapture(e.pointerId); }catch(_){}
  if(h==='anchor'||h==='hi'||h==='ho'){const i=+t.getAttribute('data-i');
    const n=fr.body[i]; const ref=h==='anchor'?[n.x,n.y]:n[h];
    selNode=i; renderHandles(); partCtl();           // selecting a node
    drag={h,i,ox:p.x-ref[0],oy:p.y-ref[1]};
  } else if(h==='rot'){const pv=part==='ear'?EAR_PV:TAIL_PV,o=fr[part],bd=part==='ear'?bindDelta(fr,EAR_BIND):tailDelta(fr);
    drag={h,part,pvx:pv[0]+o.dx+bd[0],pvy:pv[1]+o.dy+bd[1]};
  } else if(h==='move'){const o=fr[part];drag={h,part,sdx:o.dx,sdy:o.dy,px:p.x,py:p.y};}
});
svg.addEventListener('pointermove',e=>{
  if(!drag)return; const p=toSVG(e); const fr=frames[cur];
  if(drag.h==='anchor'){const n=fr.body[drag.i];const nx=p.x-drag.ox,ny=p.y-drag.oy,ddx=nx-n.x,ddy=ny-n.y;
    n.x=r2(nx);n.y=r2(ny);n.hi=[r2(n.hi[0]+ddx),r2(n.hi[1]+ddy)];n.ho=[r2(n.ho[0]+ddx),r2(n.ho[1]+ddy)];
  } else if(drag.h==='hi'||drag.h==='ho'){
    const n=fr.body[drag.i]; let nx=p.x-drag.ox, ny=p.y-drag.oy;
    if(drag.i===BUTT_NODE){ // rump node: lock angle to the tangent (set by the opposite handle); change length only
      const opp=drag.h==='hi'?'ho':'hi';
      let dx=n.x-n[opp][0], dy=n.y-n[opp][1], L=Math.hypot(dx,dy);
      if(L<0.01){dx=n[drag.h][0]-n.x; dy=n[drag.h][1]-n.y; L=Math.hypot(dx,dy)||1;}
      const ux=dx/L, uy=dy/L; let proj=(nx-n.x)*ux+(ny-n.y)*uy; if(proj<0)proj=0;
      nx=n.x+ux*proj; ny=n.y+uy*proj;
    }
    n[drag.h]=[r2(nx),r2(ny)];
  } else if(drag.h==='rot'){fr[drag.part].rot=r2(Math.atan2(p.x-drag.pvx,-(p.y-drag.pvy))*180/Math.PI);
  } else if(drag.h==='move'){const o=fr[drag.part];o.dx=r2(drag.sdx+p.x-drag.px);o.dy=r2(drag.sdy+p.y-drag.py);
  }
  renderShape();renderHandles();
});
function endDrag(){if(drag){drag=null;save();}}
svg.addEventListener('pointerup',endDrag); svg.addEventListener('pointercancel',endDrag);
const r2=v=>Math.round(v*100)/100;

// ---------- part controls ----------
function partCtl(){
  const fr=frames[cur]; const box=document.getElementById('part-ctl'); let s='';
  if(part==='ear'||part==='tail'){const o=fr[part];
    s=`<label>rotate <input type="range" id="rot" min="-180" max="180" value="${o.rot}"> <span id="rotv">${Math.round(o.rot)}°</span></label>
       <p class="hint">Drag the pink dot to rotate, the ring to move.</p>`;
  } else if(part==='eye'){
    const st=fr.eye.state;
    s=`<div class="seg"><button id="eopen" class="${st==='open'?'on':''}">Open</button><button id="eclosed" class="${st==='closed'?'on':''}">Closed</button></div>
       <p class="hint">Two states, matching the original. <b>Position is locked</b> to the head (snout · forehead · jaw) — it can't be moved by hand.</p>`;
  } else s=`<p class="hint">Drag square anchors to move, round dots to bend the curve. Click a node to select it (then <b>p</b>/<b>n</b> copy that node from the prev/next frame).${selNode!=null?` <b>Node ${selNode} selected.</b>`:''}<br>The rump node keeps a fixed tangent angle — its handles only change length.</p>`;
  box.innerHTML=s;
  const rot=document.getElementById('rot'); if(rot)rot.oninput=e=>{fr[part].rot=+e.target.value;document.getElementById('rotv').textContent=Math.round(+e.target.value)+'°';renderShape();renderHandles();save();};
  const setEye=v=>{fr.eye.state=v;partCtl();renderShape();save();};
  if(document.getElementById('eopen')){document.getElementById('eopen').onclick=()=>setEye('open');document.getElementById('eclosed').onclick=()=>setEye('closed');}
}

// ---------- wiring ----------
document.querySelectorAll('[data-part]').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('[data-part]').forEach(x=>x.classList.remove('on')); b.classList.add('on');
  part=b.getAttribute('data-part'); partCtl(); renderHandles();
});
function go(k){cur=Math.max(0,Math.min(NFR-1,k));renderAll();partCtl();}
document.getElementById('prev').onclick=()=>go(cur-1);
document.getElementById('next').onclick=()=>go(cur+1);
document.getElementById('scrub').oninput=e=>go(+e.target.value);
const lbl=dir=>dir<0?'◀ prev':'next ▶';
// copy the selected node (Body) or object (Ear/Tail/Eye) from the prev/next frame
function copyNode(dir){
  const k=cur+dir; if(k<0||k>=NFR){flag('no '+(dir<0?'previous':'next')+' frame');return;}
  const src=frames[k], fr=frames[cur];
  if(part==='body'){
    if(selNode==null){flag('click a node to select first');return;}
    const p=src.body[selNode]; fr.body[selNode]={x:p.x,y:p.y,hi:[...p.hi],ho:[...p.ho]};
    flag('node '+selNode+' '+lbl(dir));
  } else { fr[part]=clone(src[part]); flag(part+' '+lbl(dir)); }
  renderShape();renderHandles();save();
}
// copy the whole frame (all parts) from the prev/next frame
function copyWhole(dir){
  const k=cur+dir; if(k<0||k>=NFR){flag('no '+(dir<0?'previous':'next')+' frame');return;}
  frames[cur]=clone(frames[k]); renderAll();partCtl();save(); flag('whole shape '+lbl(dir));
}
// re-anchor: snap the selected node/object back to its pose-1 home (stops drift, e.g. a wandering eye)
function reAnchor(){
  const fr=frames[cur], home=initPose(cur);
  if(part==='body'){
    if(selNode==null){flag('click a node to select first');return;}
    fr.body[selNode]=clone(home.body[selNode]); flag('node '+selNode+' re-anchored');
  } else { fr[part]=clone(home[part]); flag(part+' re-anchored'); }
  renderShape();renderHandles();save();
}
document.getElementById('shapeprev').onclick=()=>copyWhole(-1);
document.getElementById('shapenext').onclick=()=>copyWhole(1);
document.getElementById('nodeprev').onclick=()=>copyNode(-1);
document.getElementById('nodenext').onclick=()=>copyNode(1);
document.getElementById('reset').onclick=()=>{frames[cur]=initPose(cur);renderAll();partCtl();save();};
['xray','ghostprev','ghostnext','ghostfirst','showdie','showh'].forEach(id=>document.getElementById(id).addEventListener('input',renderAll));
const vals=document.getElementById('vals');
for(let v=1;v<=6;v++){const b=document.createElement('button');b.textContent=v;if(v===value)b.className='on';
  b.onclick=()=>{value=v;[...vals.children].forEach((c,i)=>c.className=i+1===v?'on':'');renderShape();};vals.appendChild(b);}
addEventListener('keydown',e=>{
  // arrows always step frames, even when a slider/button has focus
  if(e.key==='ArrowLeft'){e.preventDefault();go(cur-1);return;}
  if(e.key==='ArrowRight'){e.preventDefault();go(cur+1);return;}
  if(e.target.tagName==='INPUT')return;
  if(e.key==='p')copyNode(-1);
  else if(e.key==='n')copyNode(1);
  else if(e.key==='P')copyWhole(-1);
  else if(e.key==='N')copyWhole(1);
  else if(e.key==='a'||e.key==='A')reAnchor();
  else if(e.key==='r'||e.key==='R')document.getElementById('reset').click();});

// export
function download(name,text,type='text/plain'){const b=new Blob([text],{type});const u=URL.createObjectURL(b);const a=document.createElement('a');a.href=u;a.download=name;a.click();URL.revokeObjectURL(u);}
document.getElementById('savej').onclick=()=>download('piggy-frames.json',JSON.stringify(frames));
document.getElementById('clear').onclick=()=>{if(confirm('Discard your edits and reload the default (seed) frames?')){localStorage.removeItem(LS);frames=defaultFrames();go(0);}};
document.getElementById('loadj').onclick=()=>document.getElementById('file').click();
document.getElementById('file').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const a=JSON.parse(r.result);if(Array.isArray(a)&&a.length===NFR){frames=a;save();go(0);}}catch(x){alert('bad file');}};r.readAsText(f);};
document.getElementById('gen').onclick=()=>download('Pig.tsx',genComponent());
// standalone SVG of the current frame (concrete colors, for pasting into Figma)
function frameSVG(){
  const m=shapeMarkup(frames[cur],550*cur,{die:true,fill:'#fff',col:'currentColor'}).replace(/currentColor/g,'#1a1714');
  return `<svg xmlns="http://www.w3.org/2000/svg" width="550" height="443" viewBox="0 0 550 443" fill="none">${m}</svg>`;
}
document.getElementById('copysvg').onclick=async()=>{
  const svg=frameSVG();
  try{ await navigator.clipboard.writeText(svg); flag('frame '+cur+' SVG copied'); }
  catch(_){ download('piggy-frame-'+cur+'.svg',svg,'image/svg+xml'); flag('clipboard blocked — downloaded SVG'); }
};

function genComponent(){
  const diceUses=dice.filter(Boolean)
    .map(([x,y,r])=>`      <use href="#a" transform="translate(${x} ${y}) rotate(${r})" />`).join('\n');
  const groups=frames.map((fr,k)=>{
    const e=fr.ear,t=fr.tail,ey=fr.eye, ed=bindDelta(fr,EAR_BIND), td=tailDelta(fr), ep=eyePos(fr);
    return `      <g transform="translate(${550*k} 0)">
        <path fill="#fff" ${STROKE} d="${emitBody(fr.body)}" />
        <g transform="translate(${(e.dx+ed[0]).toFixed(1)} ${(e.dy+ed[1]).toFixed(1)}) rotate(${e.rot} ${EAR_PV[0]} ${EAR_PV[1]})"><path fill="#fff" d="${EAR_FILL}" /><path fill="none" ${STROKE} d="${EAR_STROKE}" /></g>
        <g transform="translate(${(t.dx+td[0]).toFixed(1)} ${(t.dy+td[1]).toFixed(1)}) rotate(${t.rot} ${TAIL_PV[0]} ${TAIL_PV[1]})"><path fill="none" ${STROKE} d="${TAIL_D}" /></g>
        <g transform="translate(${ep[0].toFixed(1)} ${ep[1].toFixed(1)})"><path fill="currentColor" d="${ey.state==='open'?EYE_OPEN:EYE_CLOSED}" /></g>
      </g>`;}).join('\n');
  return `export function Pig({\n  value = 6,\n  short = false,\n  class: className,\n}: {\n  value?: number;\n  short?: boolean;\n  class?: string;\n}) {\n  const duration = short ? "1.2s" : "5s";\n  const offset = short ? 15 : 0;\n  const frames = short ? 8 : 52;\n  const values = [...Array(frames)].map(\n    (_, i) => \`\${550 * (i + offset)} 0 550 443\`\n  );\n  return (\n    <svg class={className} data-value={value} width="225" height="176" fill="none" viewBox={\`\${550 * (51 + offset)} 0 550 443\`}>\n      <animate attributeName="viewBox" values={values.join(";")} calcMode="discrete" fill="freeze" dur={duration} repeatCount="1" />\n${groups}\n${diceUses}\n      <defs>\n        <g id="a">\n          <rect width="54" height="54" x="5.58" y="5.58" fill="#fff" stroke="currentColor" stroke-width="10" rx="9" />\n          <g fill="currentColor">\n            {value > 3 && <circle cx="20.5811" cy="20.5808" r="5" />}\n            {value > 1 && <circle cx="44.5811" cy="20.5811" r="5" />}\n            {value === 6 && <circle cx="20.5811" cy="32.5811" r="5" />}\n            {!!(value % 2) && <circle cx="32.5811" cy="32.5811" r="5" />}\n            {value === 6 && <circle cx="44.5811" cy="32.5808" r="5" />}\n            {value > 1 && <circle cx="20.5811" cy="44.5811" r="5" />}\n            {value > 3 && <circle cx="44.5811" cy="44.5808" r="5" />}\n          </g>\n        </g>\n      </defs>\n    </svg>\n  );\n}\n`;
}

partCtl(); go(0);
</script>
